# lankafea settings for Maname (read by `lankafea generate`/`validate`, which find this
# file beside the source). The Sinhala features are generated from the LankaGlyphset
# standard; this file holds only what is Maname's own. Regenerate with `make features`.
# Reference: sinhala-font-tools/tools/feature-generator/docs/font-config.md
sinhala:
  # Touching clusters: pull the second consonant 131 units towards the first (Maname's
  # value from its hand-written dist feature).
  dist: -131

  assign:
    # The isign/iisign/usign/uusign .alt/.alt1-.alt3 variants were never wired up by the
    # hand-written features. Keep them out of the stylistic sets (aalt only) until the
    # designer decides which consonants take them.
    alts: {"1": none, "2": none, "3": none}

  featureNames:
    ss02: Sinhala historical pa+f combination   # the name Maname's ss02 has always had
